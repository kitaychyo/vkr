version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: dota2-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dota2}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dota2-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dota2}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dota2-backend
    volumes:
      - .:/app
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dota2}
      STEAM_API_KEY: ${STEAM_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dota2-network
    restart: unless-stopped
    command: >
      sh -c "sleep 5 &&
             alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000"

  # Data Collector (runs continuously)
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dota2-collector
    volumes:
      - .:/app
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dota2}
      STEAM_API_KEY: ${STEAM_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - dota2-network
    restart: unless-stopped
    command: >
      sh -c "sleep 10 &&
             python -m steam_api.collector"

  # Frontend (Nginx serving React build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dota2-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dota2-network
    restart: unless-stopped

networks:
  dota2-network:
    driver: bridge

volumes:
  postgres_data:
